name: "Build ma-version"
on:
  push:
    branches: [ma-version]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-latest is often short of capacity)"
        default: macos-latest

permissions:
  contents: read

concurrency:
  group: build-ma-version-${{ inputs.runner || 'macos-latest' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macosx

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch

      - name: Build (ad-hoc signed, no Apple account)
        run: |
          set -o pipefail
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | grep -E "error:|warning: .*glass|BUILD (SUCCEEDED|FAILED)" || true
          ls build/Build/Products/Release/
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors if build failed
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      # A fixed self-signed certificate (repo secrets) gives every build the
      # same identity, so macOS keeps the app's permissions across updates.
      # Without the secrets the app stays ad-hoc signed.
      - name: Sign with the fork's certificate
        timeout-minutes: 5
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No certificate secret, keeping ad-hoc signature"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPW=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          # -A: any tool may use the key, so codesign never waits on a prompt.
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -f pkcs12 -A
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KCPW" "$KC" > /dev/null \
            || echo "set-key-partition-list failed (continuing, the key is open to all tools)"
          security find-identity -p codesigning "$KC" || true
          ID=$(security find-certificate -c "Boring Notch Ma Version" -Z "$KC" | awk '/SHA-1/{print $NF}')
          echo "Signing identity: $ID"
          [ -n "$ID" ]
          APP=$(ls -d build/Build/Products/Release/*.app | head -1)
          bash .github/scripts/resign-app.sh "$APP" "$ID" "$KC"
          security delete-keychain "$KC"

      - name: Package app
        run: |
          cd build/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "App: $APP"
          codesign -dv --entitlements - "$APP" 2>&1 | head -30 || true
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/BoringNotch-ma-version.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-ma-version
          path: BoringNotch-ma-version.zip
          retention-days: 14
